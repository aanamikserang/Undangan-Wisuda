<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undangan Wisuda Aan</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
background:#000;
color:white;
overflow-x:hidden;
}

/* background */
.bg{
position:fixed;
top:0;
left:0;
width:100%;
height:120%;
background-image:url('background.jpg');
background-size:cover;
background-position:40% center;
z-index:-2;
transition:transform 0.1s linear;
}

.overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.3);
z-index:-1;
}

/* center */
.wrapper{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{
width:100%;
max-width:420px;
padding:30px 20px;
border-radius:25px;
text-align:center;
background:rgba(0,0,0,0.35);
border:1px solid rgba(255,255,255,0.2);
box-shadow:0 10px 30px rgba(0,0,0,0.5);
margin:auto;
}

.toga{
width:70px;
margin-bottom:10px;
}

input{
width:100%;
padding:14px;
border-radius:30px;
border:2px solid rgba(255,255,255,0.5);
background:transparent;
color:white;
text-align:center;
margin-top:15px;
}

button,.btn{
display:block;
width:100%;
margin-top:15px;
padding:14px;
border-radius:30px;
border:none;
font-weight:600;
cursor:pointer;
text-decoration:none;
}

button{background:white;color:black;}
.maps{background:white;color:black;}
.wa{background:#25D366;color:white;}

#halaman2{display:none;}

.flip-container{
display:flex;
gap:8px;
margin-top:15px;
}

.flip-box{flex:1;text-align:center;}
.label{font-size:11px;}
.flip{
background:rgba(255,255,255,0.15);
border-radius:10px;
padding:10px 0;
}

/* confetti */
.confetti{
position:fixed;
width:8px;
height:8px;
top:-10px;
animation:fall linear infinite;
z-index:0;
}

@keyframes fall{to{transform:translateY(100vh);}}
</style>
</head>

<body>

<div class="bg" id="bg"></div>
<div class="overlay"></div>

<div class="wrapper">

<!-- HALAMAN 1 -->
<div class="card" id="halaman1">
<img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png" class="toga">
<h1>Undangan Wisuda</h1>
<h3>Aan, A.Md.Kom.</h3>
<p>Masukan nama kamu</p>
<input type="text" id="namaInput" placeholder="Nama kamu...">
<button onclick="bukaUndangan()">Buka Undangan</button>
</div>

<!-- HALAMAN 2 -->
<div class="card" id="halaman2">
<h1>Hai <span id="namaTampil"></span> 👋</h1>

<p>
Dengan penuh rasa syukur,<br>
saya mengundang kamu hadir di wisuda saya
</p>

<div style="margin-top:10px;">
🎓 <b>Wisuda Aan</b><br>
📅 5 Mei 2026<br>
⏰ 09.00 WIB<br>
📍 Hotel Horison Ultima Ratu Serang
</div>

<div class="flip-container">
<div class="flip-box"><div class="label">Hari</div><div class="flip" id="hari">00</div></div>
<div class="flip-box"><div class="label">Jam</div><div class="flip" id="jam">00</div></div>
<div class="flip-box"><div class="label">Menit</div><div class="flip" id="menit">00</div></div>
<div class="flip-box"><div class="label">Detik</div><div class="flip" id="detik">00</div></div>
</div>

<a id="kalenderLink" class="btn maps">📅 Tambah ke Kalender</a>
<a id="waLink" class="btn wa">💬 Konfirmasi Kehadiran</a>

</div>

</div>

<script>
/* PARALLAX */
window.addEventListener("scroll",()=>{
let scroll=window.scrollY;
document.getElementById("bg").style.transform="translateY("+scroll*0.3+"px)";
});

/* ambil nama dari URL */
function getNamaDariURL(){
let params=new URLSearchParams(window.location.search);
return params.get("to");
}

/* buka otomatis */
window.onload=function(){
let namaURL=getNamaDariURL();
if(namaURL){
bukaDenganNama(namaURL);
}
};

/* fungsi buka */
function bukaDenganNama(nama){
document.getElementById("namaTampil").innerText=nama;

document.getElementById("waLink").href=
"https://api.whatsapp.com/send?phone=6283878272726&text=Halo Aan, saya "+nama+" hadir";

document.getElementById("kalenderLink").href=
"https://calendar.google.com/calendar/render?action=TEMPLATE&text=Wisuda Aan&dates=20260505T020000Z/20260505T050000Z";

document.getElementById("halaman1").style.display="none";
document.getElementById("halaman2").style.display="block";

/* kirim ke sheets */
fetch("https://script.google.com/macros/s/AKfycbxQo7hueuAz5ThGpipGQOr8B2iDQK4fqmPqwacofa0rXzUiBFdebXPlPwMmt6u_cOEWmQ/exec",{
method:"POST",
body:JSON.stringify({nama:nama,waktu:new Date().toLocaleString()})
});
}

/* manual input */
function bukaUndangan(){
let nama=document.getElementById("namaInput").value.trim();
if(!nama){alert("Isi nama dulu!");return;}
bukaDenganNama(nama);
}

/* countdown */
let target=new Date("2026-05-05T09:00:00").getTime();

setInterval(()=>{
let now=new Date().getTime();
let s=target-now;

document.getElementById("hari").innerText=Math.floor(s/(1000*60*60*24));
document.getElementById("jam").innerText=Math.floor((s%(1000*60*60*24))/(1000*60*60));
document.getElementById("menit").innerText=Math.floor((s%(1000*60*60))/(1000*60));
document.getElementById("detik").innerText=Math.floor((s%(1000*60))/1000);
},1000);
</script>

</body>
</html>
