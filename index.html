<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undangan Wisuda Aan</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
background:#000;
color:white;
overflow-x:hidden;
}

/* BACKGROUND */
.bg{
position:fixed;
top:0;
left:0;
width:100%;
height:120%;
background-image:url('background.jpg');
background-size:cover;
background-position:40% center;
z-index:-2;
}

.overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.4);
z-index:-1;
}

/* CENTER */
.wrapper{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

/* CARD */
.card{
width:100%;
max-width:420px;
padding:30px 20px;
border-radius:25px;
text-align:center;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,0.2);
box-shadow:0 0 25px rgba(0,255,255,0.2);
}

.toga{
width:70px;
margin-bottom:10px;
animation:float 3s infinite;
}

@keyframes float{
50%{transform:translateY(-10px);}
}

/* INPUT */
input{
width:100%;
padding:14px;
border-radius:30px;
border:2px solid rgba(255,255,255,0.5);
background:transparent;
color:white;
text-align:center;
margin-top:15px;
}

/* BUTTON */
button,.btn{
display:block;
width:100%;
margin-top:15px;
padding:14px;
border-radius:30px;
border:none;
font-weight:600;
cursor:pointer;
}

button{background:white;color:black;}
.maps{background:white;color:black;}
.wa{background:#25D366;color:white;}

#halaman2{display:none;}

/* COUNTDOWN 3D */
.flip-container{display:flex;gap:8px;margin-top:15px;}
.flip-box{flex:1;text-align:center;}
.label{font-size:11px;}
.flip{
background:rgba(255,255,255,0.15);
border-radius:10px;
padding:10px 0;
transform:perspective(200px) rotateX(10deg);
box-shadow:0 5px 20px rgba(0,0,0,0.6);
font-weight:bold;
}

/* UCAPAN */
.ucapan-box{
margin-top:15px;
max-height:250px;
overflow:auto;
padding:10px;
border-radius:15px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
box-shadow:0 0 20px rgba(0,255,255,0.2);
}

.ucapan-item{
display:flex;
gap:10px;
align-items:flex-start;
background:rgba(255,255,255,0.1);
padding:10px;
border-radius:12px;
margin-bottom:10px;
animation:fadeIn .5s;
}

.avatar{
width:40px;
height:40px;
border-radius:50%;
box-shadow:0 0 10px cyan;
}

.ucapan-content{
flex:1;
font-size:13px;
text-align:left;
}

.like-btn{
margin-top:5px;
font-size:12px;
cursor:pointer;
color:#00ffff;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<div class="bg" id="bg"></div>
<div class="overlay"></div>

<div class="wrapper">

<!-- HALAMAN 1 -->
<div class="card" id="halaman1">
<img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png" class="toga">
<h1>Undangan Wisuda</h1>
<h3>Aan, A.Md.Kom.</h3>

<p>Masukan nama kamu</p>
<input type="text" id="namaInput" placeholder="Nama kamu...">
<button onclick="bukaUndangan()">Buka Undangan</button>
</div>

<!-- HALAMAN 2 -->
<div class="card" id="halaman2">
<img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png" class="toga">

<h1>Hai <span id="namaTampil"></span> 👋</h1>

<p>Datang ya ke wisuda saya</p>

<!-- COUNTDOWN -->
<div class="flip-container">
<div class="flip-box"><div class="label">Hari</div><div class="flip" id="hari">0</div></div>
<div class="flip-box"><div class="label">Jam</div><div class="flip" id="jam">0</div></div>
<div class="flip-box"><div class="label">Menit</div><div class="flip" id="menit">0</div></div>
<div class="flip-box"><div class="label">Detik</div><div class="flip" id="detik">0</div></div>
</div>

<!-- UCAPAN -->
<input type="text" id="ucapanInput" placeholder="Tulis ucapan...">
<button onclick="kirimUcapan()">💌 Kirim Ucapan</button>

<div id="listUcapan" class="ucapan-box"></div>

<a id="waLink" class="btn wa">💬 Konfirmasi Kehadiran</a>

</div>
</div>

<script>
const URL_SCRIPT="https://script.google.com/macros/s/AKfycbxQo7hueuAz5ThGpipGQOr8B2iDQK4fqmPqwacofa0rXzUiBFdebXPlPwMmt6u_cOEWmQ/exec";

/* buka */
function bukaUndangan(){
let nama=document.getElementById("namaInput").value;
if(!nama){alert("Isi nama dulu");return;}

document.getElementById("namaTampil").innerText=nama;
document.getElementById("halaman1").style.display="none";
document.getElementById("halaman2").style.display="block";

ambilUcapan();
}

/* avatar */
function avatar(n){
return "https://api.dicebear.com/7.x/initials/svg?seed="+n;
}

/* kirim */
function kirimUcapan(){
let nama=document.getElementById("namaTampil").innerText;
let ucapan=document.getElementById("ucapanInput").value;

fetch(URL_SCRIPT,{
method:"POST",
body:JSON.stringify({nama,ucapan,like:0})
}).then(()=>{
document.getElementById("ucapanInput").value="";
ambilUcapan();
});
}

/* like */
function like(i){
fetch(URL_SCRIPT,{
method:"POST",
body:JSON.stringify({likeIndex:i})
}).then(()=>ambilUcapan());
}

/* ambil */
function ambilUcapan(){
fetch(URL_SCRIPT)
.then(r=>r.json())
.then(d=>{
let box=document.getElementById("listUcapan");
box.innerHTML="";

d.reverse().forEach((x,i)=>{
box.innerHTML+=`
<div class="ucapan-item">
<img src="${avatar(x.nama)}" class="avatar">
<div class="ucapan-content">
<b>${x.nama}</b><br>${x.ucapan}
<div class="like-btn" onclick="like(${d.length-1-i})">
👍 ${x.like||0}
</div>
</div>
</div>`;
});
});
}

/* realtime */
setInterval(ambilUcapan,5000);

/* countdown */
let target=new Date("2026-05-05T09:00:00").getTime();
setInterval(()=>{
let now=new Date().getTime();
let s=target-now;

document.getElementById("hari").innerText=Math.floor(s/86400000);
document.getElementById("jam").innerText=Math.floor((s%86400000)/3600000);
document.getElementById("menit").innerText=Math.floor((s%3600000)/60000);
document.getElementById("detik").innerText=Math.floor((s%60000)/1000);
},1000);
</script>

</body>
</html>
