<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undangan Wisuda Aan</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#000;color:white;overflow-x:hidden;}

.bg{
position:fixed;width:100%;height:120%;
background:url('background.jpg') center/cover;
z-index:-2;
}
.overlay{
position:fixed;width:100%;height:100%;
background:rgba(0,0,0,0.4);z-index:-1;
}

.wrapper{
display:flex;justify-content:center;align-items:center;
min-height:100vh;padding:20px;
}

.card{
width:100%;max-width:420px;padding:25px;
border-radius:25px;text-align:center;
background:rgba(0,0,0,0.35);
border:1px solid rgba(255,255,255,0.2);
}

input{
width:100%;padding:12px;border-radius:30px;
background:transparent;color:white;
border:2px solid rgba(255,255,255,0.5);
margin-top:10px;
}

button{
width:100%;padding:12px;border-radius:30px;
margin-top:10px;border:none;
background:white;color:black;cursor:pointer;
}

.btn{display:block;margin-top:10px;padding:12px;border-radius:30px;}
.wa{background:#25D366;color:white;}

#halaman2,#halaman3{display:none;}

/* UCAPAN */
.ucapan-box{
max-height:300px;overflow:auto;margin-top:10px;text-align:left;
}

.ucapan-item{
background:rgba(255,255,255,0.1);
padding:10px;border-radius:10px;margin-bottom:10px;
position:relative;
}

.reply{
margin-left:15px;margin-top:5px;font-size:12px;
opacity:0.9;
}

.like-btn, .reply-btn{
font-size:12px;color:#00ffff;cursor:pointer;margin-top:5px;
}

.top-comment{
border:1px solid gold;
box-shadow:0 0 10px gold;
}

.like-anim{
position:absolute;
left:50%;top:50%;
transform:translate(-50%,-50%);
font-size:30px;
animation:pop .6s ease;
}
@keyframes pop{
0%{transform:scale(0);opacity:0;}
50%{transform:scale(1.5);opacity:1;}
100%{transform:scale(1);opacity:0;}
}

.notif{
position:fixed;
top:20px;left:50%;
transform:translateX(-50%);
background:#00ffff;color:black;
padding:10px 20px;border-radius:20px;
z-index:999;
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>

<div class="wrapper">

<!-- HALAMAN 1 -->
<div class="card" id="halaman1">
<h2>Undangan Wisuda</h2>
<input id="namaInput" placeholder="Nama kamu">
<button onclick="bukaUndangan()">Buka</button>
</div>

<!-- HALAMAN 2 -->
<div class="card" id="halaman2">
<h2>Hai <span id="namaTampil"></span></h2>
<p>Datang ya ke wisuda saya 🎓</p>
<button onclick="keUcapan()">💌 Kirim Ucapan</button>
<a id="waLink" class="btn wa">Konfirmasi Kehadiran</a>
</div>

<!-- HALAMAN 3 -->
<div class="card" id="halaman3">
<h3>💬 Ucapan & Doa</h3>

<input id="ucapanInput" placeholder="Tulis ucapan...">
<button onclick="kirimUcapan()">Kirim</button>

<div id="listUcapan" class="ucapan-box"></div>

<button onclick="kembali()">⬅ Kembali</button>
</div>

</div>

<audio id="notifSound">
<source src="https://assets.mixkit.co/sfx/preview/mixkit-message-pop-alert-2354.mp3">
</audio>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
getFirestore, collection, addDoc, onSnapshot,
updateDoc, doc, increment
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ===== CONFIG (ISI PUNYA KAMU) ===== */
const firebaseConfig = {
apiKey: "ISI_APIKEY",
authDomain: "ISI_DOMAIN",
projectId: "ISI_PROJECT_ID",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let namaUser="";
let lastCount=0;

/* NAVIGASI */
window.bukaUndangan=()=>{
namaUser=document.getElementById("namaInput").value;
if(!namaUser)return alert("Isi nama dulu");
document.getElementById("namaTampil").innerText=namaUser;
halaman1.style.display="none";
halaman2.style.display="block";
};

window.keUcapan=()=>{
halaman2.style.display="none";
halaman3.style.display="block";
};

window.kembali=()=>{
halaman3.style.display="none";
halaman2.style.display="block";
};

/* AVATAR */
function avatar(n){
return "https://api.dicebear.com/7.x/initials/svg?seed="+encodeURIComponent(n);
}

/* KIRIM */
window.kirimUcapan=async()=>{
let text=ucapanInput.value;
if(!text)return;

await addDoc(collection(db,"ucapan"),{
nama:namaUser,
ucapan:text,
like:0,
reply:[],
created:Date.now()
});

ucapanInput.value="";
};

/* LIKE */
window.like=async(id)=>{
await updateDoc(doc(db,"ucapan",id),{
like:increment(1)
});
};

/* REPLY */
window.balas=async(id)=>{
let isi=prompt("Balas:");
if(!isi)return;

let ref=doc(db,"ucapan",id);
await updateDoc(ref,{
reply: [...(window.cache[id]?.reply||[]), {nama:namaUser,text:isi}]
});
};

/* DOUBLE TAP */
window.doubleTapLike=(el,id)=>{
let now=Date.now();
let last=el.dataset.last||0;

if(now-last<300){
like(id);
let anim=document.createElement("div");
anim.className="like-anim";
anim.innerText="❤️";
el.appendChild(anim);
setTimeout(()=>anim.remove(),600);
}
el.dataset.last=now;
};

/* NOTIF */
function notif(){
let div=document.createElement("div");
div.className="notif";
div.innerText="Ucapan baru!";
document.body.appendChild(div);
notifSound.play();
setTimeout(()=>div.remove(),2000);
}

/* REALTIME */
window.cache={};

onSnapshot(collection(db,"ucapan"),(snap)=>{
let data=[];
snap.forEach(doc=>{
let d=doc.data();
d.id=doc.id;
data.push(d);
window.cache[doc.id]=d;
});

data.sort((a,b)=>b.created-a.created);

let maxLike=Math.max(...data.map(x=>x.like||0));

listUcapan.innerHTML="";

data.forEach(item=>{
let div=document.createElement("div");
div.className="ucapan-item "+((item.like===maxLike && maxLike>0)?"top-comment":"");

div.innerHTML=`
<div onclick="doubleTapLike(this,'${item.id}')">
<img src="${avatar(item.nama)}" width="30">
<b>${item.nama}</b><br>${item.ucapan}
</div>

<div class="like-btn" onclick="like('${item.id}')">👍 ${item.like||0}</div>
<div class="reply-btn" onclick="balas('${item.id}')">💬 Balas</div>
`;

(item.reply||[]).forEach(r=>{
div.innerHTML+=`<div class="reply"><b>${r.nama}:</b> ${r.text}</div>`;
});

listUcapan.appendChild(div);
});

/* notif */
if(data.length>lastCount && lastCount!==0){
notif();
}
lastCount=data.length;

});
</script>

</body>
</html>
