<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undangan Wisuda Aan</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#000;color:white;overflow-x:hidden;}

/* BACKGROUND */
.bg{
position:fixed;top:0;left:0;width:100%;height:120%;
background:url('background.jpg') no-repeat center/cover;
z-index:-2;transition:transform 0.1s linear;
}
.overlay{
position:fixed;width:100%;height:100%;
background:rgba(0,0,0,0.3);z-index:-1;
}

/* CENTER */
.wrapper{
display:flex;justify-content:center;align-items:center;
min-height:100vh;padding:20px;
}

/* CARD */
.card{
width:100%;max-width:420px;padding:30px 20px;
border-radius:25px;text-align:center;
background:rgba(0,0,0,0.35);
border:1px solid rgba(255,255,255,0.2);
box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

/* INPUT CENTER */
input,textarea{
width:80%;
max-width:280px;
margin:12px auto;
display:block;
padding:14px;
border-radius:20px;
border:2px solid rgba(255,255,255,0.5);
background:transparent;
color:white;
text-align:center;
}

button,.btn{
display:block;width:100%;margin-top:15px;
padding:14px;border-radius:30px;border:none;
font-weight:600;cursor:pointer;text-decoration:none;
}
button{background:white;color:black;}
.maps{background:white;color:black;}
.wa{background:#25D366;color:white;}

#halaman2,#halaman3{display:none;}

/* COUNTDOWN 3D */
.flip-container{display:flex;gap:8px;margin-top:15px;}
.flip-box{flex:1;text-align:center;}
.flip{
background:rgba(255,255,255,0.15);
border-radius:10px;
padding:12px 0;
font-size:18px;
font-weight:bold;
perspective:100px;
}
.flip span{
display:block;
transition:transform 0.5s;
transform-style:preserve-3d;
}
.flip.animate span{
transform:rotateX(360deg);
}

/* UCAPAN */
.ucapan-list{margin-top:20px;max-height:300px;overflow:auto;}
.ucapan-card{
display:flex;gap:10px;padding:12px;margin-bottom:10px;
border-radius:15px;background:rgba(255,255,255,0.08);
animation:fadeUp 0.5s ease;
}
.avatar{
width:40px;height:40px;border-radius:50%;
display:flex;align-items:center;justify-content:center;
font-weight:bold;
}
.ucapan-content{flex:1;text-align:left;}
.ucapan-nama{font-weight:600;font-size:14px;}
.ucapan-text{font-size:13px;}
.ucapan-waktu{font-size:11px;opacity:0.6;}

.like-btn{cursor:pointer;font-size:12px;transition:0.2s;}
.like-btn.pop{transform:scale(1.5);}

.burst{
position:absolute;width:8px;height:8px;border-radius:50%;
pointer-events:none;animation:burst 0.6s forwards;
}
@keyframes burst{
to{opacity:0;transform:translate(var(--x),var(--y));}
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;}
}
</style>
</head>

<body>

<div class="bg" id="bg"></div>
<div class="overlay"></div>

<div class="wrapper">

<!-- HALAMAN 1 -->
<div class="card" id="halaman1">
<h1>Undangan Wisuda</h1>
<h3>Aan, A.Md.Kom.</h3>
<p>Masukan nama kamu</p>
<input id="namaInput">
<button onclick="bukaUndangan()">Buka</button>
</div>

<!-- HALAMAN 2 -->
<div class="card" id="halaman2">
<h2>Hai <span id="namaTampil"></span></h2>

<div>
📅 5 Mei 2026<br>
⏰ 09.00 WIB<br>
📍 Serang
</div>

<div class="flip-container">
<div class="flip-box"><div class="flip" id="hari"><span>00</span></div></div>
<div class="flip-box"><div class="flip" id="jam"><span>00</span></div></div>
<div class="flip-box"><div class="flip" id="menit"><span>00</span></div></div>
<div class="flip-box"><div class="flip" id="detik"><span>00</span></div></div>
</div>

<a onclick="bukaHalaman3()" class="btn maps">💌 Ucapan</a>
<a id="waLink" class="btn wa">Konfirmasi</a>
</div>

<!-- HALAMAN 3 -->
<div class="card" id="halaman3">
<h3>Ucapan</h3>
<input id="namaUcapan" placeholder="Nama">
<textarea id="isiUcapan" placeholder="Ucapan"></textarea>
<button onclick="kirimUcapan()">Kirim</button>
<div id="listUcapan" class="ucapan-list"></div>
<button onclick="kembali()" class="btn maps">Kembali</button>
</div>

</div>

<audio id="musik" loop src="musik.mp3"></audio>
<audio id="notifSound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

<script>
const URL="https://script.google.com/macros/s/AKfycbxQo7hueuAz5ThGpipGQOr8B2iDQK4fqmPqwacofa0rXzUiBFdebXPlPwMmt6u_cOEWmQ/exec";

/* warna avatar */
function getWarna(nama){
let hash=0;
for(let i=0;i<nama.length;i++){
hash=nama.charCodeAt(i)+((hash<<5)-hash);
}
return `hsl(${hash%360},70%,55%)`;
}

/* buka */
function bukaUndangan(){
let nama=namaInput.value;
namaTampil.innerText=nama;
halaman1.style.display="none";
halaman2.style.display="block";
musik.play();
}

/* halaman */
function bukaHalaman3(){
halaman2.style.display="none";
halaman3.style.display="block";
loadUcapan();
}
function kembali(){
halaman3.style.display="none";
halaman2.style.display="block";
}

/* kirim */
function kirimUcapan(){
let n=namaUcapan.value;
let u=isiUcapan.value;
let waktu=new Date().toLocaleString();

let div=document.createElement("div");
div.className="ucapan-card";
div.innerHTML=`
<div class="avatar" style="background:${getWarna(n)}">${n[0]}</div>
<div class="ucapan-content">
<div class="ucapan-nama">${n}</div>
<div>${u}</div>
<div class="ucapan-waktu">${waktu}</div>
<div class="like-btn">❤️ 0</div>
</div>`;
listUcapan.prepend(div);

fetch(URL,{method:"POST",body:JSON.stringify({nama:n,ucapan:u,waktu:waktu})});
isiUcapan.value="";
}

/* load */
function loadUcapan(){
fetch(URL).then(r=>r.json()).then(data=>{
let html="";
data.reverse().forEach(r=>{
html+=`
<div class="ucapan-card">
<div class="avatar" style="background:${getWarna(r[0])}">${r[0][0]}</div>
<div class="ucapan-content">
<div>${r[0]}</div>
<div>${r[1]}</div>
<div>${r[2]}</div>
<div class="like-btn" onclick="likeUcapan(${r[3]},this)">❤️ ${r[4]||0}</div>
</div></div>`;
});
listUcapan.innerHTML=html;
});
}

/* like */
function likeUcapan(id,el){
notifSound.play();
el.classList.add("pop");
setTimeout(()=>el.classList.remove("pop"),200);

for(let i=0;i<6;i++){
let b=document.createElement("div");
b.className="burst";
b.style.setProperty("--x",(Math.random()*60-30)+"px");
b.style.setProperty("--y",(Math.random()*60-30)+"px");
b.style.left=el.getBoundingClientRect().left+"px";
b.style.top=el.getBoundingClientRect().top+"px";
b.style.background="hsl("+Math.random()*360+",100%,60%)";
document.body.appendChild(b);
setTimeout(()=>b.remove(),600);
}

fetch(URL,{method:"POST",body:JSON.stringify({action:"like",id:id})});
}

/* countdown 3D */
function updateFlip(id,val){
let el=document.getElementById(id);
let span=el.querySelector("span");
if(span.innerText!=val){
el.classList.add("animate");
setTimeout(()=>el.classList.remove("animate"),500);
}
span.innerText=String(val).padStart(2,'0');
}

let target=new Date("2026-05-05T09:00:00").getTime();
setInterval(()=>{
let s=target-Date.now();
updateFlip("hari",Math.floor(s/86400000));
updateFlip("jam",Math.floor(s%86400000/3600000));
updateFlip("menit",Math.floor(s%3600000/60000));
updateFlip("detik",Math.floor(s%60000/1000));
},1000);
</script>

</body>
</html>
